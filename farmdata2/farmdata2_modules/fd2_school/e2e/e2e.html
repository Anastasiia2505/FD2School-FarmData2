<!DOCTYPE html>
<html>
<body>
  <div id="harvest-report" v-cloak>
    <h1 data-cy="page-header">Harvest Report</h1>

    <label>Report Title: </label>
    <input v-model="reportTitle" placeholder="Enter report title here" />
    <br /><br />

    <label>Start: </label>
    <input data-cy="start-date" type="date" v-model="reportStartDate" :max="reportEndDate" />

    <label>End: </label>
    <input data-cy="end-date" type="date" v-model="reportEndDate" :min="reportStartDate" />
    <br /><br />

    <label>Crop: </label>
    <select data-cy="crop-dropdown" v-model="reportCrop">
      <option value="">Select a crop</option>
      <option v-for="crop in cropNames" :key="crop" :value="crop">{{ crop }}</option>
    </select>

    <label>Area: </label>
    <select v-model="reportArea">
      <option value="">Select an area</option>
      <option v-for="area in areaNames" :key="area" :value="area">{{ area }}</option>
    </select>

    <br /><br />

    <button data-cy="generate-report-button" @click="generateReport">Generate Report</button>
    <br /><br />

    <div data-cy="report-header" v-if="reportFarm && reportUser && reportLanguage">
      <p><strong>Farm:</strong> {{ reportFarm }}</p>
      <p><strong>User:</strong> {{ reportUser }}</p>
      <p><strong>Language:</strong> {{ reportLanguage }}</p>
    </div>

    <h2>Harvest Report Table:</h2>
    <p v-if="harvestReportRows.length === 0">No matching records.</p>

    <table v-if="harvestReportRows.length > 0" border="1">
      <thead>
        <tr>
          <th>Row</th>
          <th>Date</th>
          <th>Area</th>
          <th>Crop</th>
          <th>Yield</th>
          <th>Units</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        <tr v-for="(log, index) in harvestReportRows" :key="index">
          <td>{{ index + 1 }}</td>
          <td>{{ log.date }}</td>
          <td>{{ log.area }}</td>
          <td>{{ log.crop }}</td>
          <td>{{ log.yield }}</td>
          <td>{{ log.units }}</td>
          <td><button @click="deleteRow(index)">Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3"></script>
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- dayjs -->
  <script src="https://unpkg.com/dayjs"></script>

  <script>
    const HarvestReport = Vue.createApp({
      created() {
        getIDToCropMap()
          .then((Map) => {
            this.idToCropMap = Map;
          });

        getIDToAreaMap()
          .then((Map) => {
            this.idToAreaMap = Map;
          });
      },

      data() {
        return {
          reportTitle: "",
          reportStartDate: "2020-05-05",
          reportEndDate: "2020-05-15",
          reportCrop: "",
          reportArea: "",
          reportFarm: "",
          reportUser: "",
          reportLanguage: "",
          harvestLogResults: [],
          idToCropMap: new Map(),
          idToAreaMap: new Map()
        };
      },

      computed: {
        cropNames() {
          return Array.from(this.idToCropMap.values());
        },
        areaNames() {
          return Array.from(this.idToAreaMap.values());
        },
        harvestReportRows() {
          let tableRows = [];

          for (let log of this.harvestLogResults) {
            // Area
            let area = log.area?.[0]?.name || "Unknown";

            // Quantity
            let harvestQty = log.quantity?.find(q => q.label === "harvest") || log.quantity?.[0];
            let yieldVal = harvestQty?.value || 0;
            let units = harvestQty?.unit?.name || "";

            // Crop
            //let cropTid = parseInt(log.data?.crop_tid);
            //let crop = this.idToCropMap.get(cropTid)|| "Unknown";
            let crop = log.crop?.[0]?.name || "Unknown";

            // Filter by selected crop (if any)
            if (this.reportCrop && crop !== this.reportCrop) {
              continue;
            }

            // Date
            let date = dayjs.unix(log.timestamp).format("YYYY-MM-DD");

            tableRows.push({
              date,
              area,
              crop,
              yield: yieldVal,
              units
            });
          }

          return tableRows;
        }
      },

      methods: {
        generateReport() {
          axios.get("/farm.json").then((res) => {
            this.reportFarm = res.data.name;
            this.reportUser = res.data.user.name;
            this.reportLanguage = res.data.user.language;

            let startTS = dayjs(this.reportStartDate).unix();
            let endTS = dayjs(this.reportEndDate).unix();

            const url = `/log.json?type=farm_harvest&timestamp[ge]=${startTS}&timestamp[le]=${endTS}`;

            axios.get(url).then((res) => {
              this.harvestLogResults = res.data.list;
            }); 

            


          });
        },

        deleteRow(index) {
          this.harvestLogResults.splice(index, 1);
        }
      }
    }).mount("#harvest-report");
  </script>
</body>
</html>
